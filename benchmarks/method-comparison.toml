# Step 3.5 — method comparison on the SAME stores the sweeps built (no new stores).
# For every store: embedding-only vs pure BM25 vs RRF fusion of the two, through the
# shared grading path. Store files are declared source-backed (read-only reuse).
# m002/m003 (in-text number probes) are the rows hybrid should fix; m001/m011/m012
# (header-driven) and m013-m015 (unanswerable) are the calibration witnesses.

[stores.baseline]
model = "bge-m3"
source = "data/naive_store.json"
max_chars = 1800
overlap = 0.15
header = true

[stores.merge-2400]
model = "bge-m3"
source = "data/benchmark_stores/merge-2400.json"
max_chars = 2400
overlap = 0.15
header = true

[stores.merge-1200]
model = "bge-m3"
source = "data/benchmark_stores/merge-1200.json"
max_chars = 1200
overlap = 0.15
header = true

[stores.merge-1800-noheader]
model = "bge-m3"
source = "data/benchmark_stores/merge-1800-noheader.json"
max_chars = 1800
overlap = 0.15
header = false

[stores.qwen3-06b]
model = "qwen3-embedding:0.6b"
source = "data/benchmark_stores/qwen3-06b.json"
max_chars = 1800
overlap = 0.15
header = true

[stores.nomic-v2-moe]
model = "nomic-embed-text-v2-moe"
source = "data/benchmark_stores/nomic-v2-moe.json"
max_chars = 1800
overlap = 0.15
header = true

[[experiments]]
name = "baseline-embedding"
store = "baseline"
retrieval = "embedding"

[[experiments]]
name = "baseline-bm25"
store = "baseline"
retrieval = "bm25"

[[experiments]]
name = "baseline-rrf"
store = "baseline"
retrieval = "rrf"

[[experiments]]
name = "merge-2400-embedding"
store = "merge-2400"
retrieval = "embedding"

[[experiments]]
name = "merge-2400-bm25"
store = "merge-2400"
retrieval = "bm25"

[[experiments]]
name = "merge-2400-rrf"
store = "merge-2400"
retrieval = "rrf"

[[experiments]]
