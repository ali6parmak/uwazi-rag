# Step 3.5 sweep 2 — embedding models, all at the default chunk geometry
# (merge, 1800/0.15, header on). One store per model — cosine never mixes
# embedding spaces. The baseline reuses the committed data/naive_store.json
# read-only (bge-m3 1024d, legacy config = Step 2 defaults).
# nomic-embed-text:v1.5 is deliberately NOT shortlisted (English-centric).

[stores.baseline]
model = "bge-m3"
source = "data/naive_store.json"
max_chars = 1800
overlap = 0.15
header = true

[stores.qwen3-06b]
model = "qwen3-embedding:0.6b"
max_chars = 1800
overlap = 0.15
header = true

[stores.nomic-v2-moe]
model = "nomic-embed-text-v2-moe"
max_chars = 1800
overlap = 0.15
header = true

[[experiments]]
name = "bge-m3-baseline"
store = "baseline"

[[experiments]]
name = "qwen3-embedding-06b"
store = "qwen3-06b"

[[experiments]]
name = "nomic-embed-v2-moe"
store = "nomic-v2-moe"