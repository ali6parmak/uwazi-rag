# Step 3.5 sweep 1 — chunk geometry, one store per experiment, model fixed at bge-m3.
# [stores.<slug>] = what to build (or reuse read-only via source); [[experiments]] = what to grade.
# The baseline reuses the committed data/naive_store.json read-only — its effective chunk
# config is the Step 2 defaults it was built under (it predates recorded chunk_config).

[stores.baseline]
model = "bge-m3"
source = "data/naive_store.json"
max_chars = 1800
overlap = 0.15
header = true

[stores.merge-1200]
model = "bge-m3"
max_chars = 1200
overlap = 0.15
header = true

[stores.merge-2400]
model = "bge-m3"
max_chars = 2400
overlap = 0.15
header = true

[stores.merge-1800-noheader]
model = "bge-m3"
max_chars = 1800
overlap = 0.15
header = false

[[experiments]]
name = "baseline-1800-header"
store = "baseline"

[[experiments]]
name = "merge-1200"
store = "merge-1200"

[[experiments]]
name = "merge-2400"
store = "merge-2400"

[[experiments]]
name = "merge-1800-noheader"
store = "merge-1800-noheader"