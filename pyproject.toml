# Standalone semantic search + RAG service for Uwazi instances.
# Mirrors python_uwazi_API's style: uv + hatchling + src layout (PLAN.md Step 0).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uwazi-rag"
version = "0.1.0"
description = "Semantic search and RAG service for Uwazi instance collections"
requires-python = ">=3.12"
dependencies = [
    "uwazi-API",
    "fastapi",
    "uvicorn",
    "pydantic",
    "loguru",
    "httpx",
    "numpy",
    "psycopg[binary,pool]",
    "load-dotenv",
]

[project.scripts]
uwazi-rag = "uwazi_rag.drivers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12.5",
    "mypy>=1.0",
]

# The Uwazi HTTP client is the sibling repo, installed editable.
[tool.uv.sources]
uwazi-API = { path = "../python_uwazi_API", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/uwazi_rag"]

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["src/uwazi_rag/tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
